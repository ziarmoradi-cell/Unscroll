name: Unscroll
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Unscroll:
    type: application
    platform: iOS
    sources: [App, Shared, Core, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.unscroll
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Unscroll
        UnscrollAppGroup: group.com.example.unscroll
        NSMotionUsageDescription: Unscroll liest deine iPhone-Schritte, damit du fürs Gehen Bildschirmzeit verdienen kannst.
        NSCameraUsageDescription: Unscroll erkennt deine Übungen direkt auf dem iPhone, um Bildschirmzeit gutzuschreiben. Kamerabilder werden nicht gespeichert oder hochgeladen.
        NSAlarmKitUsageDescription: Unscroll weckt dich zur gewünschten Uhrzeit.
        NSGKFriendListUsageDescription: Unscroll zeigt dir deine Game-Center-Freunde für gemeinsame Vergleiche.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.game-center: true
        com.apple.security.application-groups: [group.com.example.unscroll]
    dependencies:
      - target: UnscrollMonitor
  UnscrollMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.unscroll.monitor
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/Monitor-Info.plist
      properties:
        UnscrollAppGroup: group.com.example.unscroll
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActivityMonitor
    entitlements:
      path: Config/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.unscroll]
