name: iOS build and counting tests
on:
  push:
    branches: [feature/pose-recognition, fix/camera-feedback, fix/reliability-audio-detox]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          python3 - <<'PYCODE'
          import glob, subprocess, re
          paths = glob.glob('/Applications/Xcode*.app')
          paths = [p for p in paths if 'beta' not in p.lower()]
          def version(p):
              out = subprocess.check_output([p + '/Contents/Developer/usr/bin/xcodebuild', '-version'], text=True)
              return tuple(map(int, re.search(r'Xcode ([0-9.]+)', out)[1].split('.')))
          chosen = max(paths, key=version)
          subprocess.run(['sudo', 'xcode-select', '-s', chosen + '/Contents/Developer'], check=True)
          print(chosen)
          PYCODE
      - name: Test pose counting and economy
        working-directory: Unscroll_Xcode_V1
        run: swift test
      - name: Build app and monitor extension
        run: xcodebuild -project Unscroll_Xcode_V1/Unscroll.xcodeproj -scheme Unscroll -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/UnscrollBuild" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Capture actual simulator screens
        run: python3 scripts/simulator_screens.py
      - uses: actions/upload-artifact@v4
        with:
          name: unscroll-screens
          path: screenshots
